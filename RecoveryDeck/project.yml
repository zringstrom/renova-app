name: Renova
options:
  bundleIdPrefix: com.zringstrom
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  RecoveryKit:
    path: Packages/RecoveryKit
targets:
  Renova:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Renova
    dependencies:
      - package: RecoveryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zringstrom.recoverydeck
        PRODUCT_NAME: Renova
        INFOPLIST_KEY_CFBundleDisplayName: Renova
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: Q68R2888XW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect to your heart-rate chest strap for morning heart-rate measurements."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ENABLE_PREVIEWS: true
  RenovaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RenovaTests
    dependencies:
      - target: Renova
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
schemes:
  Renova:
    build:
      targets:
        Renova: all
        RenovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RenovaTests
